{% extends "layouts/base.html" %}
{% block title %}Recuperar Senha | BarberShop{% endblock %}

{% block content %}
<div class="flex justify-center">
    <div class="w-full max-w-md bg-white border border-gray-200 rounded-lg shadow-lg p-8">

        <!-- Título -->
        <div class="text-center mb-8">
            <h2 class="font-industrial text-3xl uppercase tracking-widest text-iron">
                Recuperar Senha
            </h2>
            <p class="text-sm text-gray-500 mt-2 leading-relaxed">
                Informe seu e-mail cadastrado.<br>
                Se existir uma conta, enviaremos as instruções.
            </p>
        </div>

        <!-- Form -->
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm uppercase tracking-wider text-gray-600 mb-1">
                    E-mail
                </label>
                <input type="email" name="email" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-md bg-white text-gray-800
                              focus:outline-none focus:ring-2 focus:ring-leather focus:border-leather">
            </div>

            <button type="submit"
                class="w-full bg-iron text-white py-3 font-industrial tracking-widest uppercase
                       hover:bg-leather transition shadow-md">
                Enviar Instruções
            </button>
        </form>

        <!-- Voltar -->
        <div class="text-center mt-6 text-sm">
            <a href="{% url 'accounts:login' %}"
               class="text-gray-500 hover:text-leather transition">
                Voltar para o login
            </a>
        </div>

    </div>
</div>
{% endblock %}
