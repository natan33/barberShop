{% extends "layouts/base.html" %}
{% block title %}E-mail Enviado | BarberShop{% endblock %}

{% block content %}
<div class="flex justify-center">
    <div class="w-full max-w-md bg-white border border-gray-200 rounded-lg shadow-lg p-10 text-center">

        <!-- Ícone -->
        <div class="flex justify-center mb-6">
            <i class="fas fa-paper-plane text-4xl text-leather"></i>
        </div>

        <!-- Título -->
        <h2 class="font-industrial text-2xl uppercase tracking-widest text-iron mb-4">
            E-mail Enviado
        </h2>

        <!-- Texto -->
        <p class="text-gray-600 text-sm leading-relaxed">
            Enviamos as instruções para o seu e-mail.<br>
            Verifique sua caixa de entrada e também a pasta de spam.
        </p>

        <!-- Ação -->
        <div class="mt-8">
            <a href="{% url 'accounts:login' %}"
               class="inline-block text-sm uppercase tracking-widest font-industrial
                      text-gray-500 hover:text-leather transition">
                Voltar para o Login
            </a>
        </div>

    </div>
</div>
{% endblock %}
