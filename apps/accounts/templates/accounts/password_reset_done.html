{% extends "layouts/base.html" %}
{% block title %}Senha Alterada | BarberShop{% endblock %}

{% block content %}
<div class="flex justify-center">
    <div class="w-full max-w-md bg-white border border-gray-200 rounded-lg shadow-lg p-10 text-center">

        <!-- Ícone -->
        <div class="flex justify-center mb-6">
            <i class="fas fa-check-circle text-4xl text-green-600"></i>
        </div>

        <!-- Título -->
        <h2 class="font-industrial text-2xl uppercase tracking-widest text-iron mb-4">
            Senha Alterada
        </h2>

        <!-- Texto -->
        <p class="text-gray-600 text-sm leading-relaxed mb-8">
            Sua nova senha foi definida com sucesso.<br>
            Agora você já pode acessar o sistema.
        </p>

        <!-- CTA -->
        <a href="{% url 'accounts:login' %}"
           class="inline-block bg-iron text-white font-industrial tracking-widest uppercase
                  px-10 py-3 hover:bg-leather transition shadow-md">
            Fazer Login
        </a>

    </div>
</div>
{% endblock %}
