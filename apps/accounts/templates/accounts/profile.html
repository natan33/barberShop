{% extends "layouts/base.html" %}

{% block title %}Perfil | BarberShop{% endblock %}

{% block content %}
<div class="flex justify-center">
    <div class="w-full max-w-3xl bg-white border border-gray-200 rounded-lg shadow-lg p-8">

        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="font-industrial text-3xl uppercase tracking-widest text-iron">
                    Perfil
                </h1>
                <p class="text-sm text-gray-500 mt-1">
                    Informações da sua conta
                </p>
            </div>

            <div class="w-14 h-14 rounded-full bg-iron flex items-center justify-center text-white font-industrial text-xl">
                {{ user.username|slice:":1"|upper }}
            </div>
        </div>

        <!-- Info Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Username -->
            <div class="border border-gray-200 rounded p-4">
                <p class="text-xs uppercase tracking-widest text-gray-500 mb-1">
                    Usuário
                </p>
                <p class="text-lg font-medium text-gray-800">
                    {{ user.username }}
                </p>
            </div>

            <!-- Email -->
            <div class="border border-gray-200 rounded p-4">
                <p class="text-xs uppercase tracking-widest text-gray-500 mb-1">
                    Email
                </p>
                <p class="text-lg font-medium text-gray-800">
                    {{ user.email|default:"Não informado" }}
                </p>
            </div>

        </div>

        <!-- Actions -->
        <div class="flex flex-col md:flex-row gap-4 mt-10">
            <a href="#"
               class="flex-1 text-center py-3 border border-iron font-industrial tracking-widest uppercase hover:bg-iron hover:text-white transition">
                Editar Perfil
            </a>

            <a href="#"
               class="flex-1 text-center py-3 bg-leather text-white font-industrial tracking-widest uppercase hover:brightness-110 transition">
                Alterar Senha
            </a>
        </div>

    </div>
</div>
{% endblock %}
